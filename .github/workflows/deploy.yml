name: Deploy to GitHub Pages

on:
  push:
    branches: "main" # Change this if your default branch is "master"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Ruby and install/cache Gems from Gemfile
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Installs Ruby
          bundler-cache: true # Automatically runs 'bundle install' and caches gems [1]

      # 2. Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Install Bun dependencies
      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      # 4. Build site (Runs bun build AND jekyll build successfully)
      - name: Build site
        run: bun run build

      # 5. Upload the compiled Jekyll output folder
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site' 

      # 6. Push live to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

