---
layout: null
---
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - Daksh Kaul</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">

  <link href="{{ '/css/hover.css' | relative_url }}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/css/lightgallery-bundle.min.css" />
  <link href="{{ '/css/style.css' | relative_url }}" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/logos/lamda-delta-logo-dark.svg' | relative_url }}">

  <script type="module" src="{{ '/bundle.js' | relative_url }}"></script>
  <script src="https://kit.fontawesome.com/2ad54d8774.js" crossorigin="anonymous"></script>
</head>

<body>

  <div class="position-relative marquee-container d-none d-sm-block">
    <div class="marquee d-flex justify-content-around">
      <a class="hvr-hang" href="{{ '/index.html' | relative_url }}" rel="noopener noreferrer">
        <span class="loop-text hvr-grow-rotate"><b>Daksh Kaul</b>...</span>
      </a>
    </div>
  </div>

  <div class="divTable navTable">
    <div class="divTableBody">
      <div class="divTableRow">
        <div class="divTableCell">
          <a class="hvr-hang" href="{{ '/about_me.html' | relative_url }}" rel="noopener noreferrer">
            <h1 class="nav-btn">About Me</h1>
          </a>
        </div>
        <div class="divTableCell">
          <a class="hvr-hang" href="{{ '/current_projects.html' | relative_url }}" rel="noopener noreferrer">
            <h1 class="nav-btn">Current Projects</h1>
          </a>
        </div>
        <div class="divTableCell">
          <a class="hvr-hang" href="{{ '/publications.html' | relative_url }}" rel="noopener noreferrer">
            <h1 class="nav-btn">Publications</h1>
          </a>
        </div>
        <div class="divTableCell">
          <a class="hvr-hang" href="{{ '/blog.html' | relative_url }}" rel="noopener noreferrer">
            <h1 class="nav-btn">Blog</h1>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div id="gallery" class="divTable projectDivTable">
    <div class="divTableBody">
      <div class="divTableRow">
        <div class="divTableCell">
          <article class="blog-post">
            <p class="blog-date">{{ page.date | date: "%B %d, %Y" }}</p>
            <h1 class="blog-title">{{ page.title }}</h1>
            <img class="gallery-img blog-hero-img"
              src="{{ page.image | default: '/assets/photos/me.jpg' | relative_url }}" alt="{{ page.title | escape }}">
            <div class="blog-body">
              {{ content }}
            </div>
            <br>
            <p><a href="{{ '/blog.html' | relative_url }}" class="read-more-btn"><i
                  class="fa-solid fa-arrow-left-long"></i> Back</a></p>
          </article>
        </div>
      </div>
    </div>
  </div>

  <!-- lightGallery init script -->
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/lightgallery.min.js"></script>
  <script>
    lightGallery(document.getElementById('gallery'), {
      selector: '.gallery-img',
      speed: 5,
      backdropDuration: 10,
    });
  </script>

  <div class="divTable navTable">
    <div class="divTableBody">
      <div class="divTableRow">
        <div class="divTableCell">
          <p>Copyright &copy; <span id="year"></span> Daksh Kaul. All Rights Reserved.</p>
        </div>
        <div class="divTableCell">
          <a class="social-icon hvr-hang" href="https://github.com/DriftingOtter" target="_blank"
            rel="noopener noreferrer"><i class="fa-brands fa-github-alt"></i></a>
          <a class="social-icon hvr-hang" href="https://www.linkedin.com/in/dakshkaul/" target="_blank"
            rel="noopener noreferrer"><i class="fa-brands fa-linkedin social-icons"></i></a>
          <a class="social-icon hvr-hang" href="{{ '/assets/resume/Daksh_Kaul__Resume_2026_2027.pdf' | relative_url }}"
            target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-file-word social-icons"></i></a>
        </div>
        <div class="divTableCell">
          <p>Watching The World Turn &hellip;</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>

</html>
